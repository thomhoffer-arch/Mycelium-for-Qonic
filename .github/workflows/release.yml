name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest   # pkg cross-compiles all targets from Linux
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build standalone binaries
        run: npm run build

      - name: Rename with version tag
        run: |
          TAG="${{ github.ref_name }}"
          cd dist
          [ -f mycelium-for-qonic-win.exe ]      && mv mycelium-for-qonic-win.exe      "mycelium-for-qonic-${TAG}-win.exe"
          [ -f mycelium-for-qonic-macos ]        && mv mycelium-for-qonic-macos        "mycelium-for-qonic-${TAG}-macos"
          [ -f mycelium-for-qonic-macos-arm64 ]  && mv mycelium-for-qonic-macos-arm64  "mycelium-for-qonic-${TAG}-macos-arm64"
          ls -lh

      - uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: dist/mycelium-for-qonic-*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: binaries
          path: dist/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/* \
            --repo "${{ github.repository }}" \
            --title "Mycelium-for-Qonic ${{ github.ref_name }}" \
            --generate-notes
